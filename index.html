<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 11월 커넥트데이</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 110%,#19643f 0,#0c3324 32%,#03110c 75%)}button{width:100%;margin-top:11px;padding:15px;border:0;border-radius:10px;font-size:17px;font-weight:800;cursor:pointer}button:disabled{opacity:.35;cursor:default}.wrap{max-width:980px;margin:auto;padding:24px}.panel{margin:16px 0;padding:24px;background:rgba(3,20,14,.96);border:2px solid #d4af37;border-radius:18px;text-align:center}.gold{color:#ffd700}.green{background:#21d07a}.yellow{background:#ffd700}.blue{background:#278cff;color:#fff}.purple{background:#a85cff;color:#fff}.orange{background:#ff7a29;color:#fff}.red{background:#ff5757;color:#fff}.hidden{display:none!important}.big{font-size:54px;font-weight:900}.status{display:inline-block;padding:8px 15px;color:#5effa3;background:#12382a;border-radius:20px;font-weight:800}.innings{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.inn{width:44px;padding:9px 0;border:1px solid #456355;border-radius:6px;color:#81958b}.inn.on{background:#ffd700;color:#071a12;font-weight:bold}.inn.done{background:#145538;color:#fff}.answer{padding:12px;color:#b9c8c1}.answer.correct{color:#ffd700;font-weight:bold}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:22px;background:#09241a;border:2px solid #456355;border-radius:14px}.ranking{width:100%;border-collapse:collapse}.ranking th,.ranking td{padding:11px;border-bottom:1px solid #214438}.ranking th{color:#ffd700;background:#0b2b20}.timer{font-size:46px;font-weight:900;color:#ffd700}.timer.danger{color:#ff5757}.progress{height:13px;margin:12px 0 20px;background:#183b2d;border-radius:10px;overflow:hidden}.bar{height:100%;width:100%;background:#21d07a;transition:width .1s linear}.bar.danger{background:#ff5757}@media(max-width:700px){.cards{grid-template-columns:1fr}.big{font-size:38px}}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:100%;max-width:540px;padding:30px;text-align:center;background:rgba(3,20,14,.96);border:2px solid #d4af37;border-radius:20px}input{width:100%;padding:14px;margin:7px 0;background:#0b2b20;border:1px solid #456355;border-radius:9px;color:#fff;font-size:18px}.opts button{text-align:left;color:#fff;background:#102f25;border:1px solid #456355}.opts button.sel{color:#071a12;background:#ffd700}.result{font-size:58px;font-weight:900}.hit{color:#ffd700}.out{color:#ff5757}</style></head><body>
<div id="join" class="screen"><div class="box"><div class="big">⚾</div><h1 class="gold">2026년 11월 커넥트데이</h1><input id="name" placeholder="닉네임(이름)"><button class="yellow" onclick="joinGame()">⚾ CONNECT PARK 입장</button><p id="msg"></p></div></div>
<div id="wait" class="screen hidden"><div class="box"><div class="big">🏟️</div><h1 class="gold">READY</h1><h2 id="pname"></h2><p>경기 시작을 기다리고 있습니다.</p></div></div>
<div id="quiz" class="screen hidden"><div class="box"><div id="innings" class="innings"></div><h2 id="inlabel" class="gold"></h2><div id="timer" class="timer">10.0</div><div class="progress"><div id="bar" class="bar"></div></div><h2 id="qtext"></h2><div id="opts" class="opts"></div><p id="answerMsg"></p></div></div>
<div id="result" class="screen hidden"><div class="box"><div id="ricon" class="big"></div><div id="rword" class="result"></div><h2 id="rdesc"></h2><p id="rdetail"></p><p>다음 이닝을 기다려주세요.</p></div></div>
<div id="clean" class="screen hidden"><div class="box"><div class="big">🧹⚾</div><h1 class="gold">CLEANING TIME</h1><div class="cards"><div class="card">🏆 2026 KBO</div><div class="card">⚾ 한국시리즈</div><div class="card">👑 MVP</div></div></div></div>
<div id="set" class="screen hidden"><div class="box"><div class="big">🏟️</div><h1 class="gold">GAME SET</h1><p>Golden Glove 시상식을 기다려주세요.</p></div></div><div id="award" class="screen hidden"><div class="box"><div class="big">🏆</div><h1 class="gold">MY FINAL RANK</h1><div id="myRank" style="margin:24px 0;font-size:58px;font-weight:900;color:#ffd700"></div><h2 id="myRankTotal"></h2><p id="myRankRecord"></p></div></div>
<script>
const db=supabase.createClient('https://bgsxsrxebgdvxxjjgdze.supabase.co','sb_publishable_wTMk3Ae3FcKgilaDVKQVvg_UF-GWb8q'),GAME='1118',Q=[{"inning": 1, "question": "대한민국 프로야구 리그의 명칭은 무엇일까요?", "answers": {"A": "MLB", "B": "KBO", "C": "NBA", "D": "KBL"}, "correct": "B"}, {"inning": 2, "question": "야구에서 한 팀이 수비할 때 경기장에 나가는 선수는 몇 명일까요?", "answers": {"A": "7명", "B": "8명", "C": "9명", "D": "10명"}, "correct": "C"}, {"inning": 3, "question": "타자가 한 번에 모든 베이스를 돌아 득점하는 타구는 무엇일까요?", "answers": {"A": "번트", "B": "홈런", "C": "볼넷", "D": "희생플라이"}, "correct": "B"}, {"inning": 4, "question": "스트라이크가 몇 개 누적되면 삼진 아웃일까요?", "answers": {"A": "2개", "B": "3개", "C": "4개", "D": "5개"}, "correct": "B"}, {"inning": 5, "question": "정규 야구 경기는 기본적으로 몇 회까지 진행될까요?", "answers": {"A": "7회", "B": "8회", "C": "9회", "D": "10회"}, "correct": "C"}, {"inning": 6, "question": "타자가 네 개의 볼을 얻어 1루로 출루하는 것은 무엇일까요?", "answers": {"A": "볼넷", "B": "삼진", "C": "도루", "D": "병살"}, "correct": "A"}, {"inning": 7, "question": "주자가 다음 베이스로 진루하기 위해 뛰는 플레이는 무엇일까요?", "answers": {"A": "번트", "B": "도루", "C": "보크", "D": "병살"}, "correct": "B"}, {"inning": 8, "question": "투수가 공을 던질 때 서 있는 곳은 무엇일까요?", "answers": {"A": "더그아웃", "B": "불펜", "C": "마운드", "D": "홈플레이트"}, "correct": "C"}, {"inning": 9, "question": "야구 수비 위치 번호 9번은 어느 포지션일까요?", "answers": {"A": "좌익수", "B": "중견수", "C": "우익수", "D": "유격수"}, "correct": "C"}],STORE='goldenGlovePlayer';let player=null,current=0,selected='',response=0,timerId=null;const $=id=>document.getElementById(id),show=id=>['join','wait','quiz','result','clean','set','award'].forEach(x=>$(x).classList.toggle('hidden',x!==id));
function token(){let t=localStorage.getItem('goldenGloveDevice');if(!t){t=crypto.randomUUID();localStorage.setItem('goldenGloveDevice',t)}return t}
async function joinGame(){let game=GAME,name=$('name').value.trim();if(!name)return alert('닉네임(이름)을 입력하세요');let device=token(),existing=await db.from('players').select('*').eq('game_code',game).eq('device_token',device).maybeSingle();let data,error;if(existing.data){data=existing.data}else{let r=await db.from('players').insert({game_code:game,nickname:name,device_token:device}).select().single();data=r.data;error=r.error}if(error){$('msg').textContent='❌ '+error.message;return}player=data;localStorage.setItem(STORE,JSON.stringify(player));$('pname').textContent='⚾ '+player.nickname;show('wait');await loadState()}
async function restore(){let saved=JSON.parse(localStorage.getItem(STORE)||'null');if(!saved)return;let{data}=await db.from('players').select('*').eq('id',saved.id).eq('game_code',saved.game_code).maybeSingle();if(!data){localStorage.removeItem(STORE);return}player=data;$('pname').textContent='⚾ '+player.nickname;show('wait');await loadState()}
async function loadState(){let{data}=await db.from('game_state').select('*').eq('id',1).single();if(data)handle(data)}
async function handle(s){if(!player)return;if(s.game_status==='WAITING'){if(s.current_inning===0){let ok=await db.from('players').select('id').eq('id',player.id).maybeSingle();if(!ok.data){localStorage.removeItem(STORE);player=null;show('join');return}}show('wait');return}if(s.game_status==='QUESTION'){await question(s);return}if(s.game_status==='RESULT'){await resultView(s.current_inning);return}if(s.game_status==='CLEANING'){clearInterval(timerId);show('clean');return}if(s.game_status==='GAME_SET'){clearInterval(timerId);show('set');return}if(s.game_status==='AWARD'){clearInterval(timerId);await showMyRank();return}}
async function question(s){let q=Q.find(x=>x.inning===s.current_inning);if(!q)return;current=q.inning;selected='';response=0;let prior=await db.from('answers').select('*').eq('player_id',player.id).eq('inning',current).maybeSingle();show('quiz');$('innings').innerHTML=Q.map(x=>`<div class="inn ${x.inning===current?'on':x.inning<current?'done':''}">${x.inning}</div>`).join('');$('inlabel').textContent=`⚾ ${current}회`;$('qtext').textContent=q.question;$('opts').innerHTML=Object.entries(q.answers).map(([k,v])=>`<button data-k="${k}" onclick="submit('${k}')">${k}. ${v}</button>`).join('');$('answerMsg').textContent='';if(prior.data){selected=prior.data.selected_answer;response=prior.data.response_time_ms;lock(`이미 제출 완료: ${selected}번`);return}startCountdown(s.question_started_at,s.question_ends_at)}
function startCountdown(start,end){clearInterval(timerId);timerId=setInterval(()=>{let remaining=Math.max(0,new Date(end).getTime()-Date.now()),sec=remaining/1000;$('timer').textContent=sec.toFixed(1);$('bar').style.width=Math.min(100,remaining/100)+'%';$('timer').classList.toggle('danger',sec<=5);$('bar').classList.toggle('danger',sec<=5);if(remaining<=0){clearInterval(timerId);lock('⏰ 시간 종료 · 미응답 OUT')}},100)}
function lock(msg){document.querySelectorAll('#opts button').forEach(b=>{b.disabled=true;if(b.dataset.k===selected)b.classList.add('sel')});$('answerMsg').textContent=msg}
async function submit(ans){if(!player)return;let state=await db.from('game_state').select('*').eq('id',1).single(),s=state.data;if(!s||s.game_status!=='QUESTION'||s.current_inning!==current)return lock('제출 시간이 종료되었습니다.');let left=new Date(s.question_ends_at).getTime()-Date.now();if(left<=0)return lock('⏰ 시간 종료 · 미응답 OUT');selected=ans;response=Math.max(0,Math.min(10000,10000-Math.round(left)));lock('⏳ 답변 저장 중...');let q=Q.find(x=>x.inning===current),r=await db.from('answers').insert({game_code:GAME,player_id:player.id,inning:current,selected_answer:ans,is_correct:ans===q.correct,response_time_ms:response});if(r.error){if(r.error.code==='23505')$('answerMsg').textContent='이미 제출한 문제입니다.';else $('answerMsg').textContent='❌ '+r.error.message;return}$('answerMsg').textContent=`⚾ ${ans}번 제출 완료 · ${(response/1000).toFixed(3)}초`}
async function resultView(inning){clearInterval(timerId);let q=Q.find(x=>x.inning===inning),r=await db.from('answers').select('*').eq('player_id',player.id).eq('inning',inning).maybeSingle();show('result');if(!r.data){$('ricon').textContent='⏰';$('rword').textContent='OUT!';$('rword').className='result out';$('rdesc').textContent='미응답';$('rdetail').textContent=`정답: ${q.correct}. ${q.answers[q.correct]}`;return}selected=r.data.selected_answer;response=r.data.response_time_ms;let hit=r.data.is_correct;$('ricon').textContent=hit?'⚾':'❌';$('rword').textContent=hit?'HIT!':'OUT!';$('rword').className='result '+(hit?'hit':'out');$('rdesc').textContent=hit?'정답입니다!':'아쉽습니다.';$('rdetail').textContent=`내 답: ${selected}. ${q.answers[selected]} · 정답: ${q.correct}. ${q.answers[q.correct]} · ${(response/1000).toFixed(3)}초`}
async function showMyRank(){let{data,error}=await db.from('leaderboard').select('*').eq('game_code',GAME).order('correct_count',{ascending:false}).order('correct_response_time_ms',{ascending:true}).limit(50);if(error||!data)return;let rank=data.findIndex(x=>Number(x.player_id)===Number(player.id))+1,total=data.length,me=rank>0?data[rank-1]:null;show('award');$('myRank').textContent=rank>0?`${rank}위`:'-';$('myRankTotal').textContent=`총 ${total}명 중 ${rank>0?rank:'-'}등`;$('myRankRecord').textContent=me?`${me.correct_count} / 9 CORRECT · ${(Number(me.correct_response_time_ms||0)/1000).toFixed(3)}초`:''}
db.channel('player-state-v3').on('postgres_changes',{event:'UPDATE',schema:'public',table:'game_state',filter:'id=eq.1'},p=>handle(p.new)).subscribe();restore();
</script></body></html>
