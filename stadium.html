<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;overflow:hidden;font-family:Arial,sans-serif;color:white;background:radial-gradient(circle at 50% 110%,#19643f 0,#0c3324 32%,#03110c 75%)}
.screen{display:none;min-height:100vh;padding:24px;align-items:center;justify-content:center} .screen.active{display:flex}
.board{position:relative;width:100%;max-width:1500px;min-height:92vh;padding:28px 42px;text-align:center;background:rgba(2,16,11,.94);border:4px solid #d4af37;border-radius:25px;box-shadow:0 0 70px rgba(255,215,0,.15),inset 0 0 50px rgba(0,0,0,.35);overflow:hidden}
.logo{color:#ffd700;font-size:25px;font-weight:900;letter-spacing:5px} .hero-title{margin:8px 0;color:#ffd700;font-size:58px;font-weight:900;letter-spacing:3px} .hero-subtitle{color:#fff;font-size:21px;font-weight:800;letter-spacing:3px}
.lobby-grid{position:relative;z-index:3;display:grid;grid-template-columns:330px 1fr;gap:30px;align-items:center;min-height:75vh}
.qr-card{padding:22px;background:white;border-radius:20px;box-shadow:0 0 35px rgba(255,255,255,.16)} .qr-card img{display:block;width:100%;height:auto} .qr-label{margin-top:14px;color:#071a12;font-size:18px;font-weight:900}
.game-code{margin:15px 0 8px;color:#ffd700;font-size:46px;font-weight:900} .joined-count{display:inline-block;margin:15px 0;padding:12px 26px;color:#5effa3;font-size:23px;font-weight:900;background:#0d3023;border-radius:30px} .join-help{color:#9cb3a8;font-size:18px}
.ball-field{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden} .player-ball{position:absolute;width:112px;height:112px;display:flex;align-items:center;justify-content:center;padding:18px;color:#071a12;font-size:15px;font-weight:900;text-align:center;word-break:break-all;background:#fff;border:3px solid #d8d8d8;border-radius:50%;box-shadow:0 8px 20px rgba(0,0,0,.35);animation:floatBall var(--duration) ease-in-out infinite alternate}
.player-ball:before,.player-ball:after{content:"";position:absolute;top:17px;width:29px;height:74px;border:3px dashed #d82d2d;border-top:none;border-bottom:none;border-radius:50%} .player-ball:before{left:12px} .player-ball:after{right:12px}
@keyframes floatBall{from{transform:translate(0,0) rotate(-5deg)}to{transform:translate(var(--dx),var(--dy)) rotate(8deg)}}
.scoreboard{display:flex;gap:12px;justify-content:center;margin:25px 0 35px} .inning-box{width:60px;padding:12px 0;color:#6c8e7e;font-size:23px;border:2px solid #315847;border-radius:7px} .inning-box.completed{color:white;background:#135338;border-color:#21d07a} .inning-box.active{color:#071a12;font-weight:900;background:#ffd700;border-color:#ffd700}
.inning{display:inline-block;padding:9px 25px;color:#071a12;font-size:23px;font-weight:900;background:#ffd700;border-radius:30px} .question{max-width:1100px;margin:25px auto 35px;font-size:38px;font-weight:700;line-height:1.45}
.answers{display:grid;max-width:1050px;margin:auto;grid-template-columns:1fr 1fr;gap:16px} .answer{padding:20px 25px;color:white;font-size:25px;text-align:left;background:#0b2b20;border:2px solid #315847;border-radius:12px} .answer.correct{color:#06150f;font-weight:900;background:#ffd700;border-color:#ffd700} .answer.wrong{opacity:.35}
.cleaning-title,.award-title{margin:25px 0;color:#ffd700;font-size:68px;font-weight:900} .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1100px;margin:35px auto} .card{padding:28px;background:#0b2b20;border:2px solid #315847;border-radius:15px} .game-set{margin:60px 0 20px;color:#ffd700;font-size:95px;font-weight:900;letter-spacing:8px}
.medal{font-size:90px} .winner{font-size:54px;color:#ffd700;font-weight:900} .ranking{width:100%;border-collapse:collapse;font-size:20px} .ranking th,.ranking td{padding:12px;border-bottom:1px solid #214438} .ranking th{color:#ffd700;background:#0b2b20}
.live{position:absolute;top:15px;right:22px;z-index:5;color:#56f39e} .live-dot{display:inline-block;width:9px;height:9px;margin-right:7px;background:#21d07a;border-radius:50%}
@media(max-width:900px){body{overflow:auto}.lobby-grid{grid-template-columns:1fr}.qr-card{width:260px;margin:auto}.player-ball{width:90px;height:90px;font-size:13px}.hero-title{font-size:40px}.answers,.cards{grid-template-columns:1fr}.question{font-size:27px}}
</style></head>

<script>
const db=supabase.createClient('https://bgsxsrxebgdvxxjjgdze.supabase.co','sb_publishable_wTMk3Ae3FcKgilaDVKQVvg_UF-GWb8q'),GAME='1118',JOIN_URL='https://bwh1210.github.io/golden-glove-quiz/',Q=[{"inning": 1, "question": "대한민국 프로야구 리그의 명칭은 무엇일까요?", "answers": {"A": "MLB", "B": "KBO", "C": "NBA", "D": "KBL"}, "correct": "B"}, {"inning": 2, "question": "야구에서 한 팀이 수비할 때 경기장에 나가는 선수는 몇 명일까요?", "answers": {"A": "7명", "B": "8명", "C": "9명", "D": "10명"}, "correct": "C"}, {"inning": 3, "question": "타자가 한 번에 모든 베이스를 돌아 득점하는 타구는 무엇일까요?", "answers": {"A": "번트", "B": "홈런", "C": "볼넷", "D": "희생플라이"}, "correct": "B"}, {"inning": 4, "question": "스트라이크가 몇 개 누적되면 삼진 아웃일까요?", "answers": {"A": "2개", "B": "3개", "C": "4개", "D": "5개"}, "correct": "B"}, {"inning": 5, "question": "정규 야구 경기는 기본적으로 몇 회까지 진행될까요?", "answers": {"A": "7회", "B": "8회", "C": "9회", "D": "10회"}, "correct": "C"}, {"inning": 6, "question": "타자가 네 개의 볼을 얻어 1루로 출루하는 것은 무엇일까요?", "answers": {"A": "볼넷", "B": "삼진", "C": "도루", "D": "병살"}, "correct": "A"}, {"inning": 7, "question": "주자가 다음 베이스로 진루하기 위해 뛰는 플레이는 무엇일까요?", "answers": {"A": "번트", "B": "도루", "C": "보크", "D": "병살"}, "correct": "B"}, {"inning": 8, "question": "투수가 공을 던질 때 서 있는 곳은 무엇일까요?", "answers": {"A": "더그아웃", "B": "불펜", "C": "마운드", "D": "홈플레이트"}, "correct": "C"}, {"inning": 9, "question": "야구 수비 위치 번호 9번은 어느 포지션일까요?", "answers": {"A": "좌익수", "B": "중견수", "C": "우익수", "D": "유격수"}, "correct": "C"}];let players=[],lb=[];
const screens=['waitingScreen','questionScreen','cleaningScreen','gameSetScreen','awardScreen']; const show=id=>screens.forEach(x=>document.getElementById(x).classList.toggle('active',x===id));
async function loadPlayers(){let{data,error}=await db.from('players').select('id,nickname,joined_at').eq('game_code',GAME).order('joined_at');if(!error){players=data||[];renderLobby()}}
function renderLobby(){document.getElementById('joinedCount').textContent=`${players.length} PLAYERS JOINED`;let field=document.getElementById('ballField');field.innerHTML='';players.slice(0,50).forEach((p,i)=>{let b=document.createElement('div');b.className='player-ball';b.textContent=p.nickname;b.style.left=`${5+(i*17)%84}%`;b.style.top=`${8+(i*23)%76}%`;b.style.setProperty('--duration',`${3.5+(i%6)*.7}s`);b.style.setProperty('--dx',`${(i%2?1:-1)*(25+(i%5)*8)}px`);b.style.setProperty('--dy',`${(i%3?1:-1)*(20+(i%4)*7)}px`);field.appendChild(b)})}
async function getLB(){let{data}=await db.from('leaderboard').select('*').eq('game_code',GAME).order('correct_count',{ascending:false}).order('correct_response_time_ms',{ascending:true}).limit(50);lb=data||[]}
const fmt=p=>p?`${p.correct_count} / 9 CORRECT · ${(Number(p.correct_response_time_ms||0)/1000).toFixed(3)}초`:'';
function innings(n){document.getElementById('inningBoard').innerHTML=Q.map(q=>`<div class="inning-box ${q.inning===n?'active':q.inning<n?'completed':''}">${q.inning}</div>`).join('')}
async function render(s){if(s.game_status==='WAITING'){show('waitingScreen');await loadPlayers();return}if(s.game_status==='QUESTION'||s.game_status==='RESULT'){let q=Q.find(x=>x.inning===s.current_inning);show('questionScreen');innings(q.inning);document.getElementById('inningLabel').textContent=`⚾ ${q.inning}회`;document.getElementById('questionText').textContent=q.question;document.getElementById('answersContainer').innerHTML=Object.entries(q.answers).map(([k,v])=>`<div class="answer ${s.game_status==='RESULT'&&k===q.correct?'correct':s.game_status==='RESULT'?'wrong':''}">${s.game_status==='RESULT'&&k===q.correct?'✅ ':''}${k}. ${v}</div>`).join('');document.getElementById('answerStatus').textContent=s.game_status==='RESULT'?'📣 정답 공개':'⚾ 참가자 답변 진행 중...';return}if(s.game_status==='CLEANING'){show('cleaningScreen');return}if(s.game_status==='GAME_SET'){show('gameSetScreen');return}if(s.game_status==='AWARD'){show('awardScreen');await getLB();let a=document.getElementById('awardContent'),st=s.award_stage;if(st==='NONE')a.innerHTML='<div class="medal">🧤🏆</div><div class="award-title">GOLDEN GLOVE AWARDS</div><h2>최종 결과 발표를 시작합니다</h2>';if(st==='THIRD')a.innerHTML=`<div class="medal">🥉</div><h2>3RD PLACE</h2><div class="winner">${lb[2]?.nickname||'-'}</div><h2>${fmt(lb[2])}</h2>`;if(st==='SECOND')a.innerHTML=`<div class="medal">🥈</div><h2>2ND PLACE</h2><div class="winner">${lb[1]?.nickname||'-'}</div><h2>${fmt(lb[1])}</h2>`;if(st==='FIRST')a.innerHTML=`<div class="medal">🥇🧤</div><h2>GOLDEN GLOVE WINNER</h2><div class="winner">${lb[0]?.nickname||'-'}</div><h2>${fmt(lb[0])}</h2>`;if(st==='RANKING'){let rows=lb.map((p,i)=>`<tr><td>${i+1}</td><td>${p.nickname}</td><td>${p.correct_count}/9</td><td>${(Number(p.correct_response_time_ms||0)/1000).toFixed(3)}초</td></tr>`).join('');a.innerHTML=`<div class="award-title">FINAL STANDINGS</div><table class="ranking"><tr><th>순위</th><th>선수</th><th>정답</th><th>시간</th></tr>${rows}</table>`}}}
async function init(){await loadPlayers();let{data}=await db.from('game_state').select('*').eq('id',1).single();if(data)render(data);db.channel('stadium-state-v2').on('postgres_changes',{event:'UPDATE',schema:'public',table:'game_state',filter:'id=eq.1'},p=>render(p.new)).subscribe();db.channel('stadium-players-v2').on('postgres_changes',{event:'*',schema:'public',table:'players'},()=>loadPlayers()).subscribe()}init();
</script></body></html>
