<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Glove Stadium</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 110%,#19643f 0,#0c3324 32%,#03110c 75%)}.wrap{max-width:980px;margin:auto;padding:24px}.panel{margin:16px 0;padding:24px;background:rgba(3,20,14,.96);border:2px solid #d4af37;border-radius:18px;text-align:center}.gold{color:#ffd700}.status{display:inline-block;padding:8px 15px;color:#5effa3;background:#12382a;border-radius:20px;font-weight:bold}.innings{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.inn{width:42px;padding:9px 0;border:1px solid #456355;border-radius:6px;color:#81958b}.inn.on{background:#ffd700;color:#071a12;font-weight:bold}.inn.done{background:#145538;color:white}.answer{padding:10px;color:#b9c8c1}.answer.correct{color:#ffd700;font-weight:bold}button{width:100%;margin-top:10px;padding:15px;border:0;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.35}.green{background:#21d07a}.yellow{background:#ffd700}.blue{background:#278cff;color:white}.purple{background:#a85cff;color:white}.red{background:#ff5757;color:white}.orange{background:#ff7a29;color:white}.hidden{display:none!important}.big{font-size:54px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:22px;background:#09241a;border:2px solid #456355;border-radius:14px}.card h2{color:#ffd700}.ranking{width:100%;border-collapse:collapse}.ranking th,.ranking td{padding:11px;border-bottom:1px solid #214438}.ranking th{color:#ffd700;background:#0b2b20}@media(max-width:650px){.cards{grid-template-columns:1fr}}body{overflow:auto}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px}.screen{width:100%;max-width:1450px;min-height:82vh;padding:40px;background:rgba(2,16,11,.96);border:4px solid #d4af37;border-radius:24px;text-align:center}.hero{font-size:78px;font-weight:900;color:#ffd700}.q{font-size:40px;font-weight:bold;line-height:1.5;margin:30px auto;max-width:1100px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:1050px;margin:auto}.answers .answer{font-size:25px;padding:22px;border:2px solid #315847;border-radius:12px;background:#0b2b20}.answers .correct{color:#071a12;background:#ffd700}.medal{font-size:90px}.winner{font-size:52px;color:#ffd700;font-weight:900}@media(max-width:700px){.answers{grid-template-columns:1fr}.hero{font-size:45px}.q{font-size:27px}}</style></head><body><div class="stage"><div class="screen"><div id="content"></div></div></div><script>
const db=supabase.createClient('https://bgsxsrxebgdvxxjjgdze.supabase.co','sb_publishable_wTMk3Ae3FcKgilaDVKQVvg_UF-GWb8q'),GAME='1118',Q=[{"inning": 1, "question": "대한민국 프로야구 리그의 명칭은 무엇일까요?", "answers": {"A": "MLB", "B": "KBO", "C": "NBA", "D": "KBL"}, "correct": "B"}, {"inning": 2, "question": "야구에서 한 팀이 수비할 때 경기장에 나가는 선수는 몇 명일까요?", "answers": {"A": "7명", "B": "8명", "C": "9명", "D": "10명"}, "correct": "C"}, {"inning": 3, "question": "타자가 한 번에 모든 베이스를 돌아 득점하는 타구는 무엇일까요?", "answers": {"A": "번트", "B": "홈런", "C": "볼넷", "D": "희생플라이"}, "correct": "B"}, {"inning": 4, "question": "스트라이크가 몇 개 누적되면 삼진 아웃일까요?", "answers": {"A": "2개", "B": "3개", "C": "4개", "D": "5개"}, "correct": "B"}, {"inning": 5, "question": "정규 야구 경기는 기본적으로 몇 회까지 진행될까요?", "answers": {"A": "7회", "B": "8회", "C": "9회", "D": "10회"}, "correct": "C"}, {"inning": 6, "question": "타자가 네 개의 볼을 얻어 1루로 출루하는 것은 무엇일까요?", "answers": {"A": "볼넷", "B": "삼진", "C": "도루", "D": "병살"}, "correct": "A"}, {"inning": 7, "question": "주자가 다음 베이스로 진루하기 위해 뛰는 플레이는 무엇일까요?", "answers": {"A": "번트", "B": "도루", "C": "보크", "D": "병살"}, "correct": "B"}, {"inning": 8, "question": "투수가 공을 던질 때 서 있는 곳은 무엇일까요?", "answers": {"A": "더그아웃", "B": "불펜", "C": "마운드", "D": "홈플레이트"}, "correct": "C"}, {"inning": 9, "question": "야구 수비 위치 번호 9번은 어느 포지션일까요?", "answers": {"A": "좌익수", "B": "중견수", "C": "우익수", "D": "유격수"}, "correct": "C"}];let lb=[];const c=document.getElementById('content');
const innings=n=>`<div class="innings">${Q.map(q=>`<div class="inn ${q.inning===n?'on':q.inning<n?'done':''}">${q.inning}</div>`).join('')}</div>`;
const fmt=p=>p?`${p.correct_count} / 9 CORRECT · ${(Number(p.correct_response_time_ms||0)/1000).toFixed(3)}초`:'';
async function getLB(){let{data,error}=await db.from('leaderboard').select('*').eq('game_code',GAME).order('correct_count',{ascending:false}).order('correct_response_time_ms',{ascending:true}).limit(50);if(!error)lb=data||[]}
async function render(s){if(s.game_status==='WAITING'){c.innerHTML=`<div class="medal">⚾</div><div class="hero">GOLDEN GLOVE</div><h2>BASEBALL QUIZ SHOW</h2><h1 class="gold">GAME CODE 1118</h1><p>선수 입장 중 · 경기 시작 대기</p>`;return}if(s.game_status==='QUESTION'||s.game_status==='RESULT'){let q=Q.find(x=>x.inning===s.current_inning);c.innerHTML=`<h2 class="gold">GOLDEN GLOVE QUIZ</h2>${innings(q.inning)}<h2>${q.inning}회 · QUESTION ${q.inning}</h2><div class="q">${q.question}</div><div class="answers">${Object.entries(q.answers).map(([k,v])=>`<div class="answer ${s.game_status==='RESULT'&&k===q.correct?'correct':''}">${s.game_status==='RESULT'&&k===q.correct?'✅ ':''}${k}. ${v}</div>`).join('')}</div><h2 class="gold">${s.game_status==='RESULT'?'📣 정답 공개':'⚾ 참가자 답변 진행 중'}</h2>`;return}if(s.game_status==='CLEANING'){c.innerHTML=`<div class="medal">🧹⚾</div><div class="hero">CLEANING TIME</div><h2>5회 종료 · 전반전 종료</h2><div class="cards"><div class="card">🏆<h2>2026 KBO</h2>정규시즌 최종 순위</div><div class="card">⚾<h2>KOREAN SERIES</h2>한국시리즈 결과</div><div class="card">👑<h2>MVP</h2>한국시리즈 MVP</div></div>`;return}if(s.game_status==='GAME_SET'){c.innerHTML=`<div class="medal">🏟️</div><div class="hero">GAME SET</div><h2>9이닝 경기가 모두 종료되었습니다</h2><h1 class="gold">🧤 GOLDEN GLOVE AWARDS</h1>`;return}if(s.game_status==='AWARD'){await getLB();let st=s.award_stage;if(st==='NONE')c.innerHTML=`<div class="medal">🧤🏆</div><div class="hero">GOLDEN GLOVE AWARDS</div><h2>최종 결과 발표를 시작합니다</h2>`;if(st==='THIRD')c.innerHTML=`<div class="medal">🥉</div><h2>3RD PLACE</h2><div class="winner">${lb[2]?.nickname||'-'}</div><h2>${fmt(lb[2])}</h2>`;if(st==='SECOND')c.innerHTML=`<div class="medal">🥈</div><h2>2ND PLACE</h2><div class="winner">${lb[1]?.nickname||'-'}</div><h2>${fmt(lb[1])}</h2>`;if(st==='FIRST')c.innerHTML=`<div class="medal">🥇🧤</div><h2>GOLDEN GLOVE WINNER</h2><div class="winner">${lb[0]?.nickname||'-'}</div><h2>${fmt(lb[0])}</h2>`;if(st==='RANKING'){let rows=lb.map((p,i)=>`<tr><td>${i+1}</td><td>${p.nickname}</td><td>${p.correct_count}/9</td><td>${(Number(p.correct_response_time_ms||0)/1000).toFixed(3)}초</td></tr>`).join('');c.innerHTML=`<div class="hero">FINAL STANDINGS</div><table class="ranking"><tr><th>순위</th><th>선수</th><th>정답</th><th>시간</th></tr>${rows}</table>`}}}
async function init(){let{data}=await db.from('game_state').select('*').eq('id',1).single();if(data)render(data);db.channel('stadium-awards').on('postgres_changes',{event:'UPDATE',schema:'public',table:'game_state',filter:'id=eq.1'},p=>render(p.new)).subscribe()}init();
</script></body></html>
