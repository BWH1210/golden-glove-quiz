<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Glove Master</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 110%,#19643f 0,#0c3324 32%,#03110c 75%)}.wrap{max-width:980px;margin:auto;padding:24px}.panel{margin:16px 0;padding:24px;background:rgba(3,20,14,.96);border:2px solid #d4af37;border-radius:18px;text-align:center}.gold{color:#ffd700}.status{display:inline-block;padding:8px 15px;color:#5effa3;background:#12382a;border-radius:20px;font-weight:bold}.innings{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.inn{width:42px;padding:9px 0;border:1px solid #456355;border-radius:6px;color:#81958b}.inn.on{background:#ffd700;color:#071a12;font-weight:bold}.inn.done{background:#145538;color:white}.answer{padding:10px;color:#b9c8c1}.answer.correct{color:#ffd700;font-weight:bold}button{width:100%;margin-top:10px;padding:15px;border:0;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.35}.green{background:#21d07a}.yellow{background:#ffd700}.blue{background:#278cff;color:white}.purple{background:#a85cff;color:white}.red{background:#ff5757;color:white}.orange{background:#ff7a29;color:white}.hidden{display:none!important}.big{font-size:54px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:22px;background:#09241a;border:2px solid #456355;border-radius:14px}.card h2{color:#ffd700}.ranking{width:100%;border-collapse:collapse}.ranking th,.ranking td{padding:11px;border-bottom:1px solid #214438}.ranking th{color:#ffd700;background:#0b2b20}@media(max-width:650px){.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="panel"><h1 class="gold">🎮 GAME MASTER</h1><div id="conn">연결 중...</div></div><div class="panel"><div id="innings" class="innings"></div></div>
<div id="game"><div class="panel"><small>CURRENT INNING</small><div id="inning" class="big gold">1회</div><div id="status" class="status">READY</div><h2 id="question">문제 공개 전</h2><div id="answers"></div></div><div class="panel"><button class="red" onclick="resetGame()">🔄 처음으로 / GAME RESET</button><button id="start" class="green" onclick="startQuestion()">⚾ 문제 공개</button><button id="reveal" class="yellow" onclick="revealAnswer()" disabled>📣 정답 공개</button><button id="next" class="blue" onclick="nextStep()" disabled>➡ NEXT</button><p id="log">준비 중...</p></div></div>
<div id="clean" class="panel hidden"><div class="big gold">🧹 CLEANING TIME</div><div class="cards"><div class="card">🏆<h2>2026 KBO</h2>정규시즌 순위</div><div class="card">⚾<h2>KOREAN SERIES</h2>한국시리즈 결과</div><div class="card">👑<h2>MVP</h2>한국시리즈 MVP</div></div><button class="green" onclick="secondHalf()">⚾ 6회 PLAY BALL</button><button class="red" onclick="resetGame()">🔄 GAME RESET</button></div>
<div id="set" class="panel hidden"><div class="big gold">🏟️ GAME SET</div><button class="yellow" onclick="startAwards()">🧤 시상식 시작</button><button class="red" onclick="resetGame()">🔄 GAME RESET</button></div>
<div id="awards" class="panel hidden"><div class="big gold">🧤 GOLDEN GLOVE</div><div class="cards"><div id="c2" class="card hidden"></div><div id="c1" class="card hidden"></div><div id="c3" class="card hidden"></div></div><button id="b3" class="yellow" onclick="award('THIRD')">🥉 3위 공개</button><button id="b2" class="yellow" onclick="award('SECOND')" disabled>🥈 2위 공개</button><button id="b1" class="yellow" onclick="award('FIRST')" disabled>🥇 1위 공개</button><button id="br" class="blue" onclick="award('RANKING')" disabled>📊 전체 순위</button><div id="rank" class="hidden"></div><button class="red" onclick="resetGame()">🔄 GAME RESET</button></div></div>
<script>
const db=supabase.createClient('https://bgsxsrxebgdvxxjjgdze.supabase.co','sb_publishable_wTMk3Ae3FcKgilaDVKQVvg_UF-GWb8q'),GAME='1118',Q=[{"inning": 1, "question": "대한민국 프로야구 리그의 명칭은 무엇일까요?", "answers": {"A": "MLB", "B": "KBO", "C": "NBA", "D": "KBL"}, "correct": "B"}, {"inning": 2, "question": "야구에서 한 팀이 수비할 때 경기장에 나가는 선수는 몇 명일까요?", "answers": {"A": "7명", "B": "8명", "C": "9명", "D": "10명"}, "correct": "C"}, {"inning": 3, "question": "타자가 한 번에 모든 베이스를 돌아 득점하는 타구는 무엇일까요?", "answers": {"A": "번트", "B": "홈런", "C": "볼넷", "D": "희생플라이"}, "correct": "B"}, {"inning": 4, "question": "스트라이크가 몇 개 누적되면 삼진 아웃일까요?", "answers": {"A": "2개", "B": "3개", "C": "4개", "D": "5개"}, "correct": "B"}, {"inning": 5, "question": "정규 야구 경기는 기본적으로 몇 회까지 진행될까요?", "answers": {"A": "7회", "B": "8회", "C": "9회", "D": "10회"}, "correct": "C"}, {"inning": 6, "question": "타자가 네 개의 볼을 얻어 1루로 출루하는 것은 무엇일까요?", "answers": {"A": "볼넷", "B": "삼진", "C": "도루", "D": "병살"}, "correct": "A"}, {"inning": 7, "question": "주자가 다음 베이스로 진루하기 위해 뛰는 플레이는 무엇일까요?", "answers": {"A": "번트", "B": "도루", "C": "보크", "D": "병살"}, "correct": "B"}, {"inning": 8, "question": "투수가 공을 던질 때 서 있는 곳은 무엇일까요?", "answers": {"A": "더그아웃", "B": "불펜", "C": "마운드", "D": "홈플레이트"}, "correct": "C"}, {"inning": 9, "question": "야구 수비 위치 번호 9번은 어느 포지션일까요?", "answers": {"A": "좌익수", "B": "중견수", "C": "우익수", "D": "유격수"}, "correct": "C"}];let idx=0,lb=[];const $=id=>document.getElementById(id);
function panels(id){['game','clean','set','awards'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
function board(){$('innings').innerHTML=Q.map((q,i)=>`<div class="inn ${i===idx?'on':i<idx?'done':''}">${q.inning}</div>`).join('')}
function prep(){panels('game');board();let q=Q[idx];$('inning').textContent=q.inning+'회';$('status').textContent='READY';$('question').textContent='문제 공개 전';$('answers').innerHTML='';$('start').disabled=false;$('reveal').disabled=true;$('next').disabled=true;$('next').className='blue';$('log').textContent=q.inning+'회 준비 완료'}
async function state(status,stage='NONE'){let{error}=await db.from('game_state').update({current_inning:Q[idx].inning,game_status:status,award_stage:stage,updated_at:new Date().toISOString()}).eq('id',1);if(error){alert(error.message);return false}return true}
function showQ(){let q=Q[idx];$('question').textContent=q.question;$('answers').innerHTML=Object.entries(q.answers).map(([k,v])=>`<div class="answer" data-k="${k}">${k}. ${v}</div>`).join('');}
async function startQuestion(){if(!await state('QUESTION'))return;showQ();$('status').textContent='QUESTION LIVE';$('start').disabled=true;$('reveal').disabled=false}
async function revealAnswer(){if(!await state('RESULT'))return;let q=Q[idx];document.querySelectorAll('.answer').forEach(x=>{if(x.dataset.k===q.correct)x.classList.add('correct')});$('status').textContent='ANSWER REVEALED';$('reveal').disabled=true;$('next').disabled=false;$('next').textContent=q.inning===5?'🧹 CLEANING TIME':q.inning===9?'🏟️ GAME SET':`➡ ${q.inning+1}회 준비`;}
async function nextStep(){let n=Q[idx].inning;if(n===5){if(await state('CLEANING'))panels('clean');return}if(n===9){if(await state('GAME_SET'))panels('set');return}idx++;if(await state('WAITING'))prep()}
async function secondHalf(){idx=5;if(await state('QUESTION')){prep();showQ();$('status').textContent='QUESTION LIVE';$('start').disabled=true;$('reveal').disabled=false}}
async function loadLB(){let{data,error}=await db.from('leaderboard').select('*').eq('game_code',GAME).order('correct_count',{ascending:false}).order('correct_response_time_ms',{ascending:true}).limit(50);if(error)throw error;lb=data||[]}
const rec=p=>p?`<h2>${p.nickname}</h2><p>${p.correct_count} / 9 CORRECT<br>${(Number(p.correct_response_time_ms||0)/1000).toFixed(3)}초</p>`:'<p>참가자 없음</p>';
async function startAwards(){try{await loadLB();if(!lb.length)return alert('참가자 데이터가 없습니다.');await state('AWARD','NONE');panels('awards');$('c1').innerHTML='🥇'+rec(lb[0]);$('c2').innerHTML='🥈'+rec(lb[1]);$('c3').innerHTML='🥉'+rec(lb[2]);}catch(e){alert(e.message)}}
async function award(stage){await state('AWARD',stage);if(stage==='THIRD'){$('c3').classList.remove('hidden');$('b3').disabled=true;$('b2').disabled=lb.length<2}if(stage==='SECOND'){$('c2').classList.remove('hidden');$('b2').disabled=true;$('b1').disabled=false}if(stage==='FIRST'){$('c1').classList.remove('hidden');$('b1').disabled=true;$('br').disabled=false}if(stage==='RANKING'){let rows=lb.map((p,i)=>`<tr><td>${i+1}</td><td>${p.nickname}</td><td>${p.correct_count}/9</td><td>${(Number(p.correct_response_time_ms||0)/1000).toFixed(3)}초</td></tr>`).join('');$('rank').innerHTML=`<h2 class="gold">FINAL STANDINGS</h2><table class="ranking"><tr><th>순위</th><th>선수</th><th>정답</th><th>시간</th></tr>${rows}</table>`;$('rank').classList.remove('hidden')}}
async function resetGame(){if(!confirm('기존 참가자와 답변을 삭제하고 처음으로 돌아갈까요?'))return;let a=await db.from('answers').delete().eq('game_code',GAME);if(a.error)return alert(a.error.message);let p=await db.from('players').delete().eq('game_code',GAME);if(p.error)return alert(p.error.message);idx=0;let{error}=await db.from('game_state').update({current_inning:0,game_status:'WAITING',award_stage:'NONE',updated_at:new Date().toISOString()}).eq('id',1);if(error)return alert(error.message);lb=[];['c1','c2','c3'].forEach(x=>$(x).classList.add('hidden'));$('rank').classList.add('hidden');$('b3').disabled=false;$('b2').disabled=true;$('b1').disabled=true;$('br').disabled=true;prep();alert('GAME RESET 완료')}
async function init(){let{data,error}=await db.from('game_state').select('*').eq('id',1).single();if(error){$('conn').textContent='❌ '+error.message;return}$('conn').textContent='🟢 Supabase 연결됨';idx=data.current_inning>0?data.current_inning-1:0;if(data.game_status==='CLEANING')panels('clean');else if(data.game_status==='GAME_SET')panels('set');else prep()}init();
</script></body></html>
