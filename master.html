<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Glove Master</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 110%,#19643f 0,#0c3324 32%,#03110c 75%)}button{width:100%;margin-top:11px;padding:15px;border:0;border-radius:10px;font-size:17px;font-weight:800;cursor:pointer}button:disabled{opacity:.35;cursor:default}.wrap{max-width:980px;margin:auto;padding:24px}.panel{margin:16px 0;padding:24px;background:rgba(3,20,14,.96);border:2px solid #d4af37;border-radius:18px;text-align:center}.gold{color:#ffd700}.green{background:#21d07a}.yellow{background:#ffd700}.blue{background:#278cff;color:#fff}.purple{background:#a85cff;color:#fff}.orange{background:#ff7a29;color:#fff}.red{background:#ff5757;color:#fff}.hidden{display:none!important}.big{font-size:54px;font-weight:900}.status{display:inline-block;padding:8px 15px;color:#5effa3;background:#12382a;border-radius:20px;font-weight:800}.innings{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.inn{width:44px;padding:9px 0;border:1px solid #456355;border-radius:6px;color:#81958b}.inn.on{background:#ffd700;color:#071a12;font-weight:bold}.inn.done{background:#145538;color:#fff}.answer{padding:12px;color:#b9c8c1}.answer.correct{color:#ffd700;font-weight:bold}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:22px;background:#09241a;border:2px solid #456355;border-radius:14px}.ranking{width:100%;border-collapse:collapse}.ranking th,.ranking td{padding:11px;border-bottom:1px solid #214438}.ranking th{color:#ffd700;background:#0b2b20}.timer{font-size:46px;font-weight:900;color:#ffd700}.timer.danger{color:#ff5757}.progress{height:13px;margin:12px 0 20px;background:#183b2d;border-radius:10px;overflow:hidden}.bar{height:100%;width:100%;background:#21d07a;transition:width .1s linear}.bar.danger{background:#ff5757}.award-layout{margin-top:24px}.podium{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:16px;align-items:end}.podium-card{padding:22px 14px;background:linear-gradient(180deg,#0d3326,#061c14);border:2px solid #456355;border-radius:18px;box-shadow:0 10px 25px #0007}.podium-card.first{min-height:285px;border-color:#ffd700;box-shadow:0 0 32px #ffd70033}.podium-card.second{min-height:235px;border-color:#d8dde4}.podium-card.third{min-height:205px;border-color:#cd7f32}.trophy{font-size:68px}.first .trophy{font-size:96px}.place{margin-top:8px;font-size:18px;font-weight:900;color:#b9c8c1}.first .place{font-size:24px;color:#ffd700}.podium-name{margin-top:13px;font-size:25px;font-weight:900}.first .podium-name{font-size:34px;color:#ffd700}.podium-record{margin-top:9px;color:#9cb3a8;line-height:1.55}.mini-rank{margin-top:22px;text-align:left}.mini-rank-row{display:grid;grid-template-columns:55px 1fr 80px 105px;gap:10px;padding:10px 12px;border-bottom:1px solid #214438}.mini-rank-row:nth-child(odd){background:#0b2b2055}.mini-rank-row .r{color:#ffd700;font-weight:900}@media(max-width:700px){.cards{grid-template-columns:1fr}.big{font-size:38px}}</style></head><body><div class="wrap">
<div class="panel"><h1 class="gold">🎮 GAME MASTER</h1><div id="conn">연결 중...</div></div><div class="panel"><div id="innings" class="innings"></div></div>
<div id="game"><div class="panel"><small>CURRENT INNING</small><div id="inning" class="big gold">1회</div><div id="status" class="status">READY</div><h2 id="question">문제 공개 전</h2><div id="timerBox" class="hidden"><div id="timer" class="timer">10.0</div><div class="progress"><div id="bar" class="bar"></div></div></div><div id="answers"></div><h3 id="answered">답변 완료 0 / 0</h3></div><div class="panel"><button class="red" onclick="resetGame()">🔄 처음으로 / GAME RESET</button><button id="start" class="green" onclick="startQuestion()">⚾ 문제 공개</button><button id="reveal" class="yellow" onclick="revealAnswer()" disabled>📣 정답 공개</button><button id="next" class="blue" onclick="nextStep()" disabled>➡ NEXT</button><p id="log">준비 중...</p></div></div>
<div id="clean" class="panel hidden"><div class="big gold">🧹 CLEANING TIME</div><div class="cards"><div class="card">🏆<h2>2026 KBO</h2>정규시즌 순위</div><div class="card">⚾<h2>KOREAN SERIES</h2>한국시리즈 결과</div><div class="card">👑<h2>MVP</h2>한국시리즈 MVP</div></div><button class="green" onclick="secondHalf()">⚾ 6회 PLAY BALL</button><button class="red" onclick="resetGame()">🔄 GAME RESET</button></div>
<div id="set" class="panel hidden"><div class="big gold">🏟️ GAME SET</div><button class="yellow" onclick="startAwards()">🧤 시상식 시작</button><button class="red" onclick="resetGame()">🔄 GAME RESET</button></div>
<div id="awards" class="panel hidden"><div class="big gold">🧤 GOLDEN GLOVE AWARDS</div><div class="award-layout"><div class="podium"><div id="c2" class="podium-card second"></div><div id="c1" class="podium-card first"></div><div id="c3" class="podium-card third"></div></div><div id="rank" class="mini-rank"></div></div><button class="red" onclick="resetGame()">🔄 GAME RESET</button></div></div><script>
const db=supabase.createClient('https://bgsxsrxebgdvxxjjgdze.supabase.co','sb_publishable_wTMk3Ae3FcKgilaDVKQVvg_UF-GWb8q'),GAME='1118',Q=[{"inning": 1, "question": "대한민국 프로야구 리그의 명칭은 무엇일까요?", "answers": {"A": "MLB", "B": "KBO", "C": "NBA", "D": "KBL"}, "correct": "B"}, {"inning": 2, "question": "야구에서 한 팀이 수비할 때 경기장에 나가는 선수는 몇 명일까요?", "answers": {"A": "7명", "B": "8명", "C": "9명", "D": "10명"}, "correct": "C"}, {"inning": 3, "question": "타자가 한 번에 모든 베이스를 돌아 득점하는 타구는 무엇일까요?", "answers": {"A": "번트", "B": "홈런", "C": "볼넷", "D": "희생플라이"}, "correct": "B"}, {"inning": 4, "question": "스트라이크가 몇 개 누적되면 삼진 아웃일까요?", "answers": {"A": "2개", "B": "3개", "C": "4개", "D": "5개"}, "correct": "B"}, {"inning": 5, "question": "정규 야구 경기는 기본적으로 몇 회까지 진행될까요?", "answers": {"A": "7회", "B": "8회", "C": "9회", "D": "10회"}, "correct": "C"}, {"inning": 6, "question": "타자가 네 개의 볼을 얻어 1루로 출루하는 것은 무엇일까요?", "answers": {"A": "볼넷", "B": "삼진", "C": "도루", "D": "병살"}, "correct": "A"}, {"inning": 7, "question": "주자가 다음 베이스로 진루하기 위해 뛰는 플레이는 무엇일까요?", "answers": {"A": "번트", "B": "도루", "C": "보크", "D": "병살"}, "correct": "B"}, {"inning": 8, "question": "투수가 공을 던질 때 서 있는 곳은 무엇일까요?", "answers": {"A": "더그아웃", "B": "불펜", "C": "마운드", "D": "홈플레이트"}, "correct": "C"}, {"inning": 9, "question": "야구 수비 위치 번호 9번은 어느 포지션일까요?", "answers": {"A": "좌익수", "B": "중견수", "C": "우익수", "D": "유격수"}, "correct": "C"}];let idx=0,lb=[],timerId=null,totalPlayers=0;const $=id=>document.getElementById(id);
function panels(id){['game','clean','set','awards'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}function board(){$('innings').innerHTML=Q.map((q,i)=>`<div class="inn ${i===idx?'on':i<idx?'done':''}">${q.inning}</div>`).join('')}
async function refreshCounts(){let p=await db.from('players').select('*',{count:'exact',head:true}).eq('game_code',GAME);totalPlayers=p.count||0;let a=await db.from('answers').select('*',{count:'exact',head:true}).eq('game_code',GAME).eq('inning',Q[idx].inning);$('answered').textContent=`답변 완료 ${a.count||0} / ${totalPlayers}`;}
function prep(){clearInterval(timerId);panels('game');board();let q=Q[idx];$('inning').textContent=q.inning+'회';$('status').textContent='READY';$('question').textContent='문제 공개 전';$('answers').innerHTML='';$('timerBox').classList.add('hidden');$('start').disabled=false;$('reveal').disabled=true;$('next').disabled=true;$('log').textContent=q.inning+'회 준비 완료';refreshCounts()}
async function update(status,extra={}){let payload={current_inning:Q[idx].inning,game_status:status,award_stage:'NONE',updated_at:new Date().toISOString(),...extra};let{error}=await db.from('game_state').update(payload).eq('id',1);if(error){alert(error.message);return false}return true}
function showQ(){let q=Q[idx];$('question').textContent=q.question;$('answers').innerHTML=Object.entries(q.answers).map(([k,v])=>`<div class="answer" data-k="${k}">${k}. ${v}</div>`).join('')}
function startTimer(end){clearInterval(timerId);$('timerBox').classList.remove('hidden');timerId=setInterval(()=>{let ms=Math.max(0,new Date(end).getTime()-Date.now()),sec=ms/1000,pct=ms/100;$('timer').textContent=sec.toFixed(1);$('bar').style.width=Math.min(100,pct)+'%';$('timer').classList.toggle('danger',sec<=5);$('bar').classList.toggle('danger',sec<=5);if(ms<=0){clearInterval(timerId);$('status').textContent='TIME UP';$('log').textContent='⏰ 10초 종료 · 정답 공개 가능';$('reveal').disabled=false}},100)}
async function startQuestion(){let start=new Date(),end=new Date(start.getTime()+10000);if(!await update('QUESTION',{question_started_at:start.toISOString(),question_ends_at:end.toISOString()}))return;showQ();$('status').textContent='QUESTION LIVE';$('start').disabled=true;$('reveal').disabled=false;$('next').disabled=true;startTimer(end);refreshCounts()}
async function revealAnswer(){clearInterval(timerId);if(!await update('RESULT'))return;let q=Q[idx];document.querySelectorAll('.answer').forEach(x=>x.dataset.k===q.correct&&x.classList.add('correct'));$('status').textContent='ANSWER REVEALED';$('reveal').disabled=true;$('next').disabled=false;$('next').textContent=q.inning===5?'🧹 CLEANING TIME':q.inning===9?'🏟️ GAME SET':`➡ ${q.inning+1}회 준비`}
async function nextStep(){let n=Q[idx].inning;if(n===5){if(await update('CLEANING',{question_started_at:null,question_ends_at:null}))panels('clean');return}if(n===9){if(await update('GAME_SET',{question_started_at:null,question_ends_at:null}))panels('set');return}idx++;if(await update('WAITING',{question_started_at:null,question_ends_at:null}))prep()}
async function secondHalf(){idx=5;prep();await startQuestion()}
async function loadLB(){let{data,error}=await db.from('leaderboard').select('*').eq('game_code',GAME).order('correct_count',{ascending:false}).order('correct_response_time_ms',{ascending:true}).limit(50);if(error)throw error;lb=data||[]}const rec=p=>p?`<h2>${p.nickname}</h2><p>${p.correct_count} / 9 CORRECT<br>${(Number(p.correct_response_time_ms||0)/1000).toFixed(3)}초</p>`:'<p>참가자 없음</p>';
async function startAwards(){await loadLB();if(!lb.length)return alert('참가자 데이터 없음');await update('AWARD',{award_stage:'RANKING'});panels('awards');let top=(p,icon,label)=>p?`<div class="trophy">${icon}</div><div class="place">${label}</div><div class="podium-name">${p.nickname}</div><div class="podium-record">${p.correct_count} / 9 CORRECT<br>${(Number(p.correct_response_time_ms||0)/1000).toFixed(3)}초</div>`:`<div class="trophy">${icon}</div><div class="place">${label}</div><div class="podium-name">-</div>`;$('c1').innerHTML=top(lb[0],'🏆🧤','1ST · GOLDEN GLOVE');$('c2').innerHTML=top(lb[1],'🥈','2ND PLACE');$('c3').innerHTML=top(lb[2],'🥉','3RD PLACE');let list=lb.slice(3,15).map((p,i)=>`<div class="mini-rank-row"><div class="r">${i+4}위</div><div>${p.nickname}</div><div>${p.correct_count}/9</div><div>${(Number(p.correct_response_time_ms||0)/1000).toFixed(3)}초</div></div>`).join('');$('rank').innerHTML=list?`<h3 class="gold">4위 ~ ${Math.min(15,lb.length)}위</h3>${list}`:''}
async function resetGame(){if(!confirm('기존 참가자와 답변을 삭제하고 처음으로 돌아갈까요?'))return;let a=await db.from('answers').delete().eq('game_code',GAME);if(a.error)return alert(a.error.message);let p=await db.from('players').delete().eq('game_code',GAME);if(p.error)return alert(p.error.message);idx=0;let{error}=await db.from('game_state').update({current_inning:0,game_status:'WAITING',award_stage:'NONE',question_started_at:null,question_ends_at:null,updated_at:new Date().toISOString()}).eq('id',1);if(error)return alert(error.message);localStorage.removeItem('goldenGlovePlayer');lb=[];prep();alert('GAME RESET 완료')}
async function init(){let{data,error}=await db.from('game_state').select('*').eq('id',1).single();if(error){$('conn').textContent='❌ '+error.message;return}$('conn').textContent='🟢 Supabase 연결됨';idx=data.current_inning>0?data.current_inning-1:0;if(data.game_status==='CLEANING')panels('clean');else if(data.game_status==='GAME_SET')panels('set');else{prep();if(data.game_status==='QUESTION'){showQ();$('status').textContent='QUESTION LIVE';$('start').disabled=true;$('reveal').disabled=false;startTimer(data.question_ends_at)}}db.channel('master-answers').on('postgres_changes',{event:'*',schema:'public',table:'answers'},refreshCounts).subscribe();db.channel('master-players').on('postgres_changes',{event:'*',schema:'public',table:'players'},refreshCounts).subscribe()}init();
</script></body></html>
